<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Loan Portal — Select Your Limit</title><style>
@import url('https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
}

body{
    background:#FFF8D6;
    font-family:'Mali',cursive;
    color:#111;
    overflow:hidden;
}

.container{
    width:94%;
    max-width:480px;
    margin:auto;
}

/* HEADER */

header{
    background:#FFCC00;
    color:#111;
    padding:12px 0;
    text-align:center;
    border-bottom:2px solid #111;
}

.logo{
    font-size:21px;
    font-weight:700;
}

.brand{
    margin-top:1px;
    font-family:Arial,sans-serif;
    font-size:10px;
    font-weight:600;
}

/* CARD */

.card{
    background:#fff;
    margin-top:10px;
    padding:14px 12px 12px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.10);
    border:1px solid #E5D36A;
}

h1{
    font-size:19px;
    margin-bottom:4px;
    color:#111;
    font-weight:700;
}

.description{
    color:#555;
    font-family:Arial,sans-serif;
    font-size:12px;
    line-height:1.3;
    margin-bottom:11px;
}

/* AMOUNT OPTIONS */

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.limit-option{
    width:100%;
    background:#fff;
    border:1px solid #D8D8D8;
    border-radius:8px;
    padding:9px 8px;
    cursor:pointer;
    text-align:left;
    font-family:'Mali',cursive;
}

.limit-option:hover{
    border-color:#FFCC00;
    background:#FFFBE8;
}

.limit-option:active{
    transform:scale(.98);
}

.limit{
    font-size:13px;
    font-weight:700;
    color:#111;
}

.fee{
    margin-top:2px;
    font-family:Arial,sans-serif;
    font-size:10px;
    color:#666;
}

/* SELECTED */

.selected{
    border:2px solid #111;
    background:#FFF3A6;
    padding:8px 7px;
}

/* CONTINUE */

.continue-btn{
    width:100%;
    margin-top:11px;
    padding:11px;
    border:none;
    border-radius:9px;
    background:#FFCC00;
    color:#111;
    font-family:'Mali',cursive;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

.continue-btn:disabled{
    background:#E4D58A;
    color:#777;
    cursor:not-allowed;
}

/* FOOTER */

footer{
    text-align:center;
    padding:9px 5px;
    color:#111;
    font-family:Arial,sans-serif;
    font-size:9px;
    line-height:1.4;
}

footer a{
    color:#111;
    text-decoration:none;
    font-weight:600;
}

/* SMALL PHONES */

@media(max-width:360px){

    .logo{
        font-size:19px;
    }

    header{
        padding:10px 0;
    }

    .card{
        margin-top:8px;
        padding:12px 10px 10px;
    }

    h1{
        font-size:17px;
    }

    .description{
        font-size:11px;
        margin-bottom:8px;
    }

    .options{
        gap:6px;
    }

    .limit-option{
        padding:8px 7px;
    }

    .limit{
        font-size:12px;
    }

    .fee{
        font-size:9px;
    }

    .continue-btn{
        margin-top:9px;
        padding:10px;
        font-size:13px;
    }

    footer{
        padding-top:7px;
        font-size:8px;
    }
}
</style></head><body><header>
    <div class="container">    <div class="logo">
        LOAN APPLICATION PORTAL
    </div>

    <div class="brand">
        Uganda Shillings (UGX)
    </div>

</div>

</header><main class="container"><section class="card"><h1>Select Your Desired Limit</h1>

<p class="description">
    Choose your preferred loan limit below to continue.
</p>

<div class="options">

    <button type="button"
            class="limit-option"
            data-limit="1228500"
            data-fee="95100">

        <div class="limit">UGX 1,228,500</div>
        <div class="fee">Fee: UGX 95,100</div>

    </button>

    <button type="button"
            class="limit-option"
            data-limit="1363500"
            data-fee="98100">

        <div class="limit">UGX 1,363,500</div>
        <div class="fee">Fee: UGX 98,100</div>

    </button>

    <button type="button"
            class="limit-option"
            data-limit="1498500"
            data-fee="108100">

        <div class="limit">UGX 1,498,500</div>
        <div class="fee">Fee: UGX 108,100</div>

    </button>

    <button type="button"
            class="limit-option"
            data-limit="1700500"
            data-fee="125100">

        <div class="limit">UGX 1,700,500</div>
        <div class="fee">Fee: UGX 125,100</div>

    </button>

    <button type="button"
            class="limit-option"
            data-limit="2100500"
            data-fee="180100">

        <div class="limit">UGX 2,100,500</div>
        <div class="fee">Fee: UGX 180,100</div>

    </button>

    <button type="button"
            class="limit-option"
            data-limit="4524500"
            data-fee="250100">

        <div class="limit">UGX 4,524,500</div>
        <div class="fee">Fee: UGX 250,100</div>

    </button>

    <button type="button"
            class="limit-option"
            data-limit="6658500"
            data-fee="300100">

        <div class="limit">UGX 6,658,500</div>
        <div class="fee">Fee: UGX 300,100</div>

    </button>

</div>

<button
    type="button"
    class="continue-btn"
    id="continueBtn"
    disabled>

    Select a Limit

</button>

</section></main><footer><a href="#">Terms &amp; Conditions</a>
&nbsp; | &nbsp;
<a href="#">Privacy Policy</a>
&nbsp; | &nbsp;
<a href="#">Support</a>

<br>

© 2026 Loan Application Portal. All rights reserved.

</footer><script>

const options =
    document.querySelectorAll(".limit-option");

const continueBtn =
    document.getElementById("continueBtn");

let selectedLimit = null;
let selectedFee = null;

options.forEach(option => {

    option.addEventListener("click", () => {

        options.forEach(item => {
            item.classList.remove("selected");
        });

        option.classList.add("selected");

        selectedLimit =
            option.dataset.limit;

        selectedFee =
            option.dataset.fee;

        continueBtn.disabled = false;

        continueBtn.textContent =
            "Continue with UGX " +
            Number(selectedLimit).toLocaleString();

    });

});

continueBtn.addEventListener("click", () => {

    if(!selectedLimit){
        return;
    }

    sessionStorage.setItem(
        "selectedLimit",
        selectedLimit
    );

    sessionStorage.setItem(
        "serviceFee",
        selectedFee
    );

    window.location.href =
        "payment.html";

});

</script></body>
</html>
